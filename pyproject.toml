[project]
name = "swarmr-kubiq"
version = "0.2.0"
description = "Agent team that authors Kubernetes mock exams for kubiq and proves every question on a live cluster before opening a PR"
readme = "README.md"
requires-python = ">=3.13"
# The team owns its SDK. `swarmr` is capped to a minor because `Team`,
# `RunContext`, `TeamBuild` and the `swarmr.teams` entry-point group are an ABI
# this package implements; a minor bump may move them.
dependencies = [
  "swarmr>=1.3,<2",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1", "types-PyYAML"]

# The one line that makes this package a team. `swarmr` reads this group from
# installed distribution metadata and imports nothing until the team is run.
[project.entry-points."swarmr.teams"]
exam_author = "swarmr_kubiq:TEAM"

[project.urls]
Homepage = "https://github.com/codectl/swarmr-kubiq"
Source = "https://github.com/codectl/swarmr-kubiq"
Issues = "https://github.com/codectl/swarmr-kubiq/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmr_kubiq"]
exclude = ["**/tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
